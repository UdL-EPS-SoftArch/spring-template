app = 'spring-template'
primary_region = 'ams'
swap_size_mb = 1024

[build]

[env]
  JAVA_OPTS = '-Xmx128m -Xms64m'
  SERVER_FORWARD_HEADERS_STRATEGY = 'NATIVE'
  SPRING_PROFILES_ACTIVE = 'flyio'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
